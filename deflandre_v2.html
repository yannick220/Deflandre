<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f3"><title>DEFLANDRE — On y va ensemble</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root{--bg:#f7f7f3;--paper:#fff;--ink:#15191a;--muted:#747978;--line:#e8e9e5;--yellow:#f7c827;--soft:#f1f1ed;--green:#237c54;--r:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#e9eae6}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e7af00;outline-offset:3px}.material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:24px;font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}.app{max-width:470px;min-height:100dvh;background:var(--bg);margin:auto;position:relative;box-shadow:0 0 70px #10101012;padding-bottom:102px}.main{padding:29px 25px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:41px}.brand{font-size:18px;font-weight:800;letter-spacing:-.9px}.mark{display:inline-block;width:9px;height:9px;background:var(--yellow);border-radius:50%;margin-left:3px}.iconbtn{border:0;background:none;padding:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--muted);text-transform:uppercase}.hero{font-size:38px;letter-spacing:-1.9px;line-height:1.12;font-weight:700;margin:12px 0 23px}.sub{color:var(--muted);font-size:12px;line-height:1.65}.match{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:33px}.match .i{font-size:25px}.match b{display:block;font-size:13px;margin-bottom:6px}.match small{color:var(--muted);font-size:11px}.match .chev{margin-left:auto;color:var(--muted);font-size:20px}.primary{display:flex;gap:13px;align-items:center;justify-content:center;width:100%;border:0;border-radius:17px;background:var(--yellow);color:var(--ink);padding:21px 16px;font-weight:800;font-size:14px;letter-spacing:-.3px;min-height:68px}.primary .material-symbols-outlined{font-size:24px}.secondary{display:flex;align-items:center;justify-content:center;gap:9px;background:transparent;border:0;width:100%;padding:19px 10px;font-size:12px;font-weight:700}.section{display:flex;align-items:center;justify-content:space-between;margin-top:40px;margin-bottom:16px}.section h2{font-size:17px;letter-spacing:-.7px;margin:0}.plain{border:0;background:none;font-size:11px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:1px}.simple-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:10px;display:flex;gap:13px;align-items:center;width:100%;text-align:left;color:var(--ink)}.simple-card .leading{background:var(--soft);border-radius:14px;width:45px;height:45px;display:grid;place-items:center;flex-shrink:0}.simple-card .ct{flex:1;min-width:0}.simple-card b{font-size:12px;display:block;margin-bottom:6px}.simple-card small{display:block;color:var(--muted);font-size:10px;line-height:1.5}.simple-card .go{font-size:19px;color:#9fa29e}.bubble{background:var(--yellow);color:var(--ink);font-weight:800;font-size:10px;border-radius:50px;min-width:22px;height:22px;display:grid;place-items:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;height:78px;padding:8px 15px max(8px,env(safe-area-inset-bottom));background:rgba(247,247,243,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:5}.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:center;width:33.3%;color:#979b98}.nav button.active{color:#141819}.nav button.active .ni{background:var(--yellow)}.ni{width:46px;height:31px;display:grid;place-items:center;border-radius:12px}.ni .material-symbols-outlined{font-size:22px}.nav span.caption{font-size:10px;font-weight:700}.back{display:flex;align-items:center;gap:12px;margin:0 0 30px}.back button{border:0;background:none;padding:0;display:grid;place-items:center}.back b{font-size:13px}.page-title{font-size:30px;line-height:1.15;letter-spacing:-1.35px;margin:0 0 8px}.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}.field{margin:20px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:10px}.field input,.field select,.field textarea{width:100%;border:1px solid #dcdfda;background:white;border-radius:14px;padding:16px;color:var(--ink);font-size:13px;outline:none}.field textarea{min-height:90px;resize:vertical}.chipset{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dddeda;background:white;border-radius:50px;padding:10px 13px;font-size:11px;font-weight:700}.chip.on{background:var(--ink);color:white;border-color:var(--ink)}.mini{font-size:10px;color:var(--muted);line-height:1.6}.result{border-bottom:1px solid var(--line);padding:20px 0;display:block;background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;color:var(--ink)}.result .name{font-size:17px;font-weight:700;letter-spacing:-.7px}.result .line{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.6}.result .tag{background:var(--soft);font-size:10px;padding:7px 9px;border-radius:8px;font-weight:700}.result .tag.yellow{background:var(--yellow)}.avatarrow{display:flex;align-items:center}.avatar{width:33px;height:33px;border:2px solid var(--bg);margin-left:-5px;border-radius:50%;background:#dbe0d9;display:grid;place-items:center;font-size:10px;font-weight:800}.avatar:first-child{margin-left:0}.notice{border-radius:16px;background:#eeefea;padding:15px 16px;font-size:11px;line-height:1.7;color:#555c57;margin:18px 0}.notice strong{color:var(--ink)}.divider{border-bottom:1px solid var(--line);margin:22px 0}.pill{border-radius:50px;background:#e9ebe5;font-size:10px;font-weight:700;padding:8px 11px;white-space:nowrap}.pill.good{background:#dff0e4;color:#276e48}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 18px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:14px 0;font-weight:700;font-size:11px;border-bottom:3px solid transparent}.tabs button.sel{color:var(--ink);border-bottom-color:var(--yellow)}.member{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.member .avatar{margin:0;width:42px;height:42px;border:0}.member b{display:block;font-size:12px}.member small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.member .right{margin-left:auto}.message{max-width:85%;padding:12px 14px;border-radius:17px 17px 17px 4px;background:#e9ebe6;font-size:11px;line-height:1.7;margin:12px 0}.message.me{margin-left:auto;background:#f7d65a;border-radius:17px 17px 4px 17px}.message small{display:block;font-size:9px;font-weight:700;margin-bottom:3px;opacity:.7}.composer{display:flex;gap:9px;align-items:center;margin-top:20px}.composer input{min-width:0;flex:1;background:white;border:1px solid var(--line);border-radius:50px;padding:15px 17px;font-size:12px}.composer button{background:var(--yellow);border:0;width:45px;height:45px;border-radius:50%;display:grid;place-items:center}.radio{display:flex;gap:13px;align-items:center;border:1px solid var(--line);background:white;border-radius:14px;padding:16px;margin-bottom:9px;cursor:pointer}.radio input{accent-color:#17191a;width:18px;height:18px}.radio b{font-size:12px}.radio small{font-size:10px;color:var(--muted);display:block;margin-top:5px;line-height:1.5}.smallbtn{padding:11px 14px;border-radius:12px;background:white;border:1px solid #dedfda;font-size:11px;font-weight:700}.smallbtn.dark{background:var(--ink);color:white;border-color:var(--ink)}.mutelabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--muted);margin-bottom:12px}.empty{text-align:center;padding:50px 15px}.empty .material-symbols-outlined{font-size:36px;color:#8f958d}.empty h3{font-size:17px}.empty p{font-size:11px;line-height:1.7;color:var(--muted)}.toast{position:fixed;z-index:20;bottom:95px;left:50%;transform:translateX(-50%);max-width:430px;width:calc(100% - 32px);background:#181d1c;color:#fff;border-radius:14px;padding:14px 16px;font-size:11px;font-weight:600;box-shadow:0 12px 40px #0003}.hide{display:none!important}.footer{font-size:9px;line-height:1.7;color:#9da19d;margin-top:25px}.slim{font-size:11px}.linkbtn{border:0;background:none;font-size:11px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;color:var(--ink)}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;flex:1}.kpi strong{display:block;font-size:23px;letter-spacing:-1px}.kpi small{font-size:9px;color:var(--muted)}
@media(min-width:700px){body{padding:26px}.app{border-radius:30px;min-height:calc(100dvh - 52px);overflow:hidden}.nav{bottom:26px;border-radius:0 0 30px 30px}.main{min-height:700px}}
</style>
</head>
<body><div class="app"><main id="root" class="main"></main><nav id="nav" class="nav"></nav></div><div id="toast" class="toast hide" role="status"></div>
<script>
const i=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={profile:{name:'Camille',city:'Rochefort',drive:'rotation',capacity:5,fee:'free',feeAmount:'',stop:'',},crews:[{id:1,name:'Les habitués',town:'Rochefort',people:['Camille','Thomas','Julie','Maxime','Emma'],driver:'Thomas',capacity:5,confirmed:['Camille','Thomas','Julie','Maxime'],mode:'rotation',fee:'free',feeAmount:'',messages:[{who:'Thomas',text:'On repart ensemble samedi ?',time:'18:40'},{who:'Julie',text:'Oui ! Je serai au rendez-vous habituel.',time:'19:12'}]}],offers:[{id:10,name:'Équipage Rochefort',town:'Rochefort',via:'Châtelaillon',people:['Thomas','Julie','Maxime'],capacity:5,fee:'beer',feeAmount:'1',driver:'Thomas',departure:'14:15',known:'Inconnus',date:'2026-11-28'},{id:11,name:'Départ Angoulins',town:'Angoulins',via:'Aytré',people:['Léa','Hugo','Nina'],capacity:4,fee:'free',feeAmount:'',driver:'Léa',departure:'14:45',known:'Via Julie',date:'2026-11-28'},{id:12,name:'La bande de Surgères',town:'Surgères',via:'Rochefort',people:['Alex','Sarah'],capacity:5,fee:'euros',feeAmount:'4',driver:'Alex',departure:'13:45',known:'Inconnus',date:'2026-11-28'}],joined:[],friends:['Thomas','Julie','Maxime','Emma'],intro:['Léa via Julie','Alex via Thomas']};
let state;try{state=JSON.parse(localStorage.getItem('deflandre_v2'))||structuredClone(seed)}catch(e){state=structuredClone(seed)}
let view='home',tab='home',crewTab='journey',selectedOffer=null,filterTown=state.profile.city,filterType='all',draftFee='free',flashTimer;
const persist=()=>localStorage.setItem('deflandre_v2',JSON.stringify(state));
const root=document.getElementById('root'),nav=document.getElementById('nav');
const head=()=>`<header class="top"><div class="brand">DEFLANDRE<span class="mark"></span></div><button class="iconbtn" aria-label="Mon profil" onclick="go('profile')">${i('person')}</button></header>`;
const backHeader=(label='Retour')=>`<div class="back"><button aria-label="Retour" onclick="back()">${i('arrow_back')}</button><b>${escapeHtml(label)}</b></div>`;
const match=()=>`<div class="match" role="button" tabindex="0" onclick="go('matches')" onkeydown="if(event.key==='Enter')go('matches')">${i('calendar_month')}<div><b>La Rochelle · Perpignan</b><small>Samedi 28 novembre · 16 h 35</small></div>${i('chevron_right').replace('material-symbols-outlined','material-symbols-outlined chev')}</div>`;
function navRender(){nav.innerHTML=[['home','home','Accueil'],['crews','directions_car','Équipages'],['messages','chat_bubble_outline','Messages']].map(([v,ic,t])=>`<button class="${tab===v?'active':''}" onclick="go('${v}')" aria-label="${t}"><span class="ni">${i(ic)}</span><span class="caption">${t}</span></button>`).join('')}
function go(v){view=v;if(['home','crews','messages'].includes(v))tab=v;render();window.scrollTo({top:0,behavior:'instant'})}
function back(){go(view==='offer'?'discover':view==='crew'?'crews':'home')}
function notify(t){const el=document.getElementById('toast');el.innerText=t;el.classList.remove('hide');clearTimeout(flashTimer);flashTimer=setTimeout(()=>el.classList.add('hide'),3200)}
function home(){return `${head()}<div class="eyebrow">Covoiturage entre supporters</div><h1 class="hero">Le stade,<br>ensemble.</h1>${match()}<button class="primary" onclick="go('discover')">${i('search')} Trouver une voiture</button><button class="secondary" onclick="go('create')">${i('add_circle')} Proposer des places</button><div class="section"><h2>Mes équipages</h2><button class="plain" onclick="go('crews')">Voir tout ${i('arrow_forward')}</button></div>${state.crews.slice(0,2).map(c=>`<button class="simple-card" onclick="openCrew(${c.id})"><span class="leading">${i('groups')}</span><span class="ct"><b>${escapeHtml(c.name)}</b><small>${escapeHtml(c.town)} · ${c.people.length} membres · ${c.mode==='rotation'?'Conduite tournante':'Conducteur fixe'}</small></span>${i('chevron_right').replace('material-symbols-outlined','material-symbols-outlined go')}</button>`).join('')}<div class="footer">Prototype indépendant. Sans affiliation au Stade Rochelais. Les matchs et équipages présentés sont des exemples.</div>`}
function discover(){return `${backHeader('Trouver un covoiturage')}<h1 class="page-title">Avec qui<br>partir ?</h1><p class="sub">Aucun contact nécessaire. Trouvez des places près de chez vous ou sur le passage d’un conducteur.</p><div class="field"><label for="city">Ma commune</label><input id="city" value="${escapeHtml(filterTown)}" autocomplete="address-level2" placeholder="Votre commune" oninput="filterTown=this.value"></div><div class="chipset"><button class="chip ${filterType==='all'?'on':''}" onclick="filterType='all';render()">Tous</button><button class="chip ${filterType==='near'?'on':''}" onclick="filterType='near';render()">À proximité</button><button class="chip ${filterType==='network'?'on':''}" onclick="filterType='network';render()">Mon réseau</button></div><div class="section"><h2>Places proposées</h2><span class="mini">28 novembre</span></div><div id="results">${offerResults()}</div><button class="secondary" onclick="go('create')">${i('add')} Créer un nouveau départ</button>`}
function offerResults(){const town=filterTown.trim().toLocaleLowerCase('fr');let a=state.offers.filter(o=>(filterType!=='network'||o.known!=='Inconnus')&&(filterType!=='near'||!town||[o.town,o.via].some(x=>x.toLocaleLowerCase('fr').includes(town)))); if(!a.length) return `<div class="empty">${i('search_off')}<h3>Aucun équipage pour ce filtre</h3><p>Élargissez votre recherche ou créez un départ.</p></div>`;return a.map(o=>`<button class="result" onclick="openOffer(${o.id})"><div class="row space"><span class="name">${escapeHtml(o.town)}</span><span class="tag ${o.people.length>=3?'yellow':''}">${o.people.length}/${o.capacity} · ${o.capacity-o.people.length} place${o.capacity-o.people.length>1?'s':''}</span></div><div class="line">${o.via?'Passe par '+escapeHtml(o.via)+' · ':''}Départ ${escapeHtml(o.departure)}</div><div class="row space" style="margin-top:14px"><span class="mini">${escapeHtml(o.known)} · ${feeLabel(o)}</span>${i('arrow_forward')}</div></button>`).join('')}
function feeLabel(o){return o.fee==='free'?'Gratuit':o.fee==='beer'?(o.feeAmount||1)+' bière(s) symbolique(s)':(o.feeAmount||'À définir')+' € / personne'}
function openOffer(id){selectedOffer=id;go('offer')}
function offer(){const o=state.offers.find(x=>x.id===selectedOffer);if(!o)return discover();const joined=state.joined.includes(o.id);return `${backHeader('Places disponibles')}<div class="eyebrow">Covoiturage · 28 novembre</div><h1 class="page-title" style="margin-top:12px">${escapeHtml(o.town)}</h1><p class="sub">Départ ${escapeHtml(o.departure)} · Via ${escapeHtml(o.via||'rendez-vous à définir')}</p><div class="row space" style="margin:28px 0 22px"><div class="avatarrow">${o.people.map(x=>`<span class="avatar" title="${escapeHtml(x)}">${escapeHtml(x[0])}</span>`).join('')}</div><span class="pill ${o.people.length>=4?'good':''}">${o.people.length} / ${o.capacity} à bord</span></div><div class="simple-card" style="cursor:default"><span class="leading">${i('directions_car')}</span><span class="ct"><b>${escapeHtml(o.driver)} conduit</b><small>${o.capacity} places au total · ${o.capacity-o.people.length} disponibles</small></span></div><div class="simple-card" style="cursor:default"><span class="leading">${i('handshake')}</span><span class="ct"><b>${feeLabel(o)}</b><small>Participation précisée par le conducteur</small></span></div><div class="notice"><strong>Parking du stade :</strong> au moins 4 occupants par voiture. Le parking doit être réservé sur la billetterie officielle, avec billet contrôlé à l’entrée. Un équipage complet ne garantit pas une place.</div><button class="primary" onclick="joinOffer(${o.id})" ${joined||o.people.length>=o.capacity?'disabled style="opacity:.6"':''}>${i(joined?'check':'person_add')}${joined?'Demande envoyée':o.people.length>=o.capacity?'Équipage complet':'Demander à rejoindre'}</button><p class="mini" style="margin-top:17px">Une demande de rejoindre ne vaut pas confirmation. Le conducteur accepte le nouveau passager.</p>`}
function joinOffer(id){if(!state.joined.includes(id)){state.joined.push(id);persist();notify('Demande enregistrée dans ce prototype.');render()}}
function create(){return `${backHeader('Proposer des places')}<h1 class="page-title">Mon prochain<br>départ.</h1><p class="sub">Quelques précisions suffisent. Pas besoin de tracer un itinéraire.</p><form onsubmit="createOffer(event)"><div class="field"><label>Commune de départ</label><input name="town" required value="${escapeHtml(state.profile.city)}"></div><div class="field"><label>Je peux passer par (facultatif)</label><input name="via" placeholder="Ex. Châtelaillon-Plage"></div><div class="field"><label>Heure de départ</label><input name="departure" type="time" value="14:15" required></div><div class="field"><label>Places dans ma voiture (conducteur compris)</label><div class="chipset">${[4,5,6,7].map(n=>`<label class="chip" style="cursor:pointer"><input type="radio" name="capacity" value="${n}" ${n===state.profile.capacity?'checked':''} style="accent-color:#15191a"> ${n}</label>`).join('')}</div><p class="mini">Le seuil du parking est de 4 personnes réellement présentes, quelle que soit la capacité du véhicule.</p></div><div class="field"><label>Participation demandée</label><div class="chipset">${[['euros','En euros'],['free','Gratuit'],['beer','En bières']].map(([v,t])=>`<button type="button" class="chip ${draftFee===v?'on':''}" onclick="draftFee='${v}';render()">${t}</button>`).join('')}</div>${draftFee!=='free'?`<input style="margin-top:12px" name="amount" type="number" min="0" step="${draftFee==='euros'?'0.5':'1'}" value="${draftFee==='beer'?'1':'4'}" aria-label="${draftFee==='beer'?'Nombre symbolique de bières':'Montant en euros par passager'}"><p class="mini">${draftFee==='euros'?'Tarif indicatif par passager. Le calcul au prorata des distances est à développer dans une version connectée.':'Contrepartie symbolique, sans obligation de consommation et jamais avant de conduire.'}</p>`:''}</div><button class="primary" type="submit">${i('add')} Publier mon départ</button></form>`}
function createOffer(e){e.preventDefault();const f=new FormData(e.target);const n=Number(f.get('capacity'));const o={id:Date.now(),name:'Mon départ',town:f.get('town').trim(),via:f.get('via').trim()||'À convenir',departure:f.get('departure'),people:[state.profile.name],driver:state.profile.name,capacity:n,fee:draftFee,feeAmount:f.get('amount')||'',known:'Mon départ',date:'2026-11-28'};state.offers.unshift(o);persist();selectedOffer=o.id;notify('Votre départ est publié localement.');go('offer')}
function crews(){return `${head()}<h1 class="page-title">Mes équipages.</h1><p class="sub">Les mêmes compagnons, d’un match à l’autre.</p><div style="height:15px"></div>${state.crews.map(c=>`<button class="simple-card" onclick="openCrew(${c.id})"><span class="leading">${i('groups')}</span><span class="ct"><b>${escapeHtml(c.name)}</b><small>${escapeHtml(c.town)} · ${c.people.length} membres</small><small>${c.mode==='rotation'?'Conduite tournante':'Conducteur fixe'}</small></span>${i('chevron_right').replace('material-symbols-outlined','material-symbols-outlined go')}</button>`).join('')}<button class="secondary" onclick="go('discover')">${i('search')} Découvrir d'autres équipages</button>`}
let activeCrew=1;function openCrew(id){activeCrew=id;crewTab='journey';go('crew')}
function crew(){const c=state.crews.find(x=>x.id===activeCrew);if(!c)return crews();const confirmed=c.confirmed.length;return `${backHeader('Mes équipages')}<h1 class="page-title">${escapeHtml(c.name)}</h1><div class="row space"><span class="sub">${escapeHtml(c.town)} · ${c.people.length} compagnons</span><span class="pill">${c.mode==='rotation'?'Conduite tournante':'Fixe'}</span></div><div class="tabs">${[['journey','Prochain match'],['chat','Messages'],['members','Membres']].map(([v,t])=>`<button class="${crewTab===v?'sel':''}" onclick="crewTab='${v}';render()">${t}</button>`).join('')}</div>${crewTab==='journey'?`<div class="eyebrow">28 novembre · Perpignan</div><div class="row space" style="margin:15px 0"><div><div style="font-size:30px;font-weight:800;letter-spacing:-1px">${confirmed}/${c.capacity}</div><div class="mini">présents confirmés · ${c.capacity} places</div></div><span class="pill ${confirmed>=4?'good':''}">${confirmed>=4?'Seuil atteint':'Seuil non atteint'}</span></div><div class="simple-card" style="cursor:default"><span class="leading">${i('sports_motorsports')}</span><span class="ct"><b>${escapeHtml(c.driver)} conduit</b><small>${c.mode==='rotation'?'Tour de conduite proposé':'Conducteur habituel'}</small></span></div><div class="row" style="margin:17px 0"><button class="smallbtn" onclick="switchDriver()">${i('sync_alt')} Échanger le tour</button><button class="smallbtn" onclick="freeSeat()">${i('person_remove')} Libérer ma place</button></div><div class="notice"><strong>Accès parking :</strong> ${confirmed>=4?'seuil de covoiturage atteint. Réservation officielle encore nécessaire.':'le nombre d’occupants est insuffisant. Chercher un remplaçant.'} <a href="https://www.staderochelais.com/je-viens-en-covoiturage" target="_blank" rel="noopener">Voir les règles du club</a>.</div>${confirmed<4?`<button class="primary" onclick="replace()">${i('person_search')} Chercher un remplaçant</button>`:''}<button class="secondary" onclick="crewTab='chat';render()">${i('chat_bubble_outline')} Ouvrir la conversation</button>`:crewTab==='chat'?`${c.messages.map(m=>`<div class="message ${m.who===state.profile.name?'me':''}"><small>${escapeHtml(m.who)} · ${escapeHtml(m.time)}</small>${escapeHtml(m.text)}</div>`).join('')}<form class="composer" onsubmit="sendMessage(event)"><input name="message" required autocomplete="off" placeholder="Écrire au groupe…"><button aria-label="Envoyer">${i('arrow_upward')}</button></form><p class="mini">Cette conversation reste disponible après le match.</p>`:`${c.people.map(p=>`<div class="member"><span class="avatar">${escapeHtml(p[0])}</span><div><b>${escapeHtml(p)}</b><small>${p===c.driver?'Conduit au prochain match':'Compagnon de route'}</small></div><span class="right">${i('check_circle')}</span></div>`).join('')}<div class="notice">Un trajet réellement effectué crée une relation de compagnon de route. Chacun peut masquer ou retirer une connexion.</div>`}`}
function switchDriver(){const c=state.crews.find(x=>x.id===activeCrew);const arr=c.confirmed;const at=arr.indexOf(c.driver);c.driver=arr[(at+1)%arr.length];persist();notify('Prochain conducteur proposé : '+c.driver);render()}
function freeSeat(){const c=state.crews.find(x=>x.id===activeCrew);const n=state.profile.name;if(!c.confirmed.includes(n)){notify('Votre place est déjà libérée.');return}c.confirmed=c.confirmed.filter(x=>x!==n);persist();notify('Place libérée. Le groupe passe à '+c.confirmed.length+' présents.');render()}
function replace(){notify('Proposition de relais envoyée aux amis et amis d’amis (simulation).')}
function sendMessage(e){e.preventDefault();const f=new FormData(e.target),t=String(f.get('message')).trim();if(!t)return;const c=state.crews.find(x=>x.id===activeCrew);c.messages.push({who:state.profile.name,text:t,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});persist();render()}
function messages(){return `${head()}<h1 class="page-title">Messages.</h1><p class="sub">Un salon par équipage. Même après le match.</p><div style="height:20px"></div>${state.crews.map(c=>`<button class="simple-card" onclick="activeCrew=${c.id};crewTab='chat';go('crew')"><span class="leading">${i('chat_bubble_outline')}</span><span class="ct"><b>${escapeHtml(c.name)}</b><small>${escapeHtml(c.messages.at(-1)?.who||'')} : ${escapeHtml((c.messages.at(-1)?.text||'Aucun message').slice(0,50))}</small></span>${i('chevron_right').replace('material-symbols-outlined','material-symbols-outlined go')}</button>`).join('')}`}
function profile(){const p=state.profile;return `${backHeader('Mon profil')}<h1 class="page-title">Mes habitudes.</h1><p class="sub">Quelques préférences pour ne pas tout ressaisir à chaque match.</p><form onsubmit="saveProfile(event)"><div class="field"><label>Prénom</label><input name="name" required value="${escapeHtml(p.name)}"></div><div class="field"><label>Ma commune</label><input name="city" required value="${escapeHtml(p.city)}"></div><div class="field"><label>Conduite habituelle</label>${[['fixed','Conducteur fixe','Je conduis généralement.'],['rotation','Conduite tournante','Nous alternons entre volontaires.'],['passenger','Passager uniquement','Je ne propose pas de voiture.']].map(([v,t,sub])=>`<label class="radio"><input type="radio" name="drive" value="${v}" ${p.drive===v?'checked':''}><span><b>${t}</b><small>${sub}</small></span></label>`).join('')}</div><div class="field"><label>Capacité de mon véhicule, moi compris</label><select name="capacity">${[4,5,6,7].map(n=>`<option ${p.capacity===n?'selected':''} value="${n}">${n} places</option>`).join('')}</select></div><div class="field"><label>Participation habituelle</label><select name="fee"><option value="free" ${p.fee==='free'?'selected':''}>Gratuit</option><option value="euros" ${p.fee==='euros'?'selected':''}>En euros</option><option value="beer" ${p.fee==='beer'?'selected':''}>En bières (symbolique)</option></select></div><button class="primary" type="submit">${i('check')} Enregistrer</button></form><div class="section"><h2>Mon réseau</h2></div><button class="simple-card" onclick="go('network')"><span class="leading">${i('group')}</span><span class="ct"><b>${state.friends.length} compagnons directs</b><small>Et leurs compagnons de route</small></span>${i('chevron_right').replace('material-symbols-outlined','material-symbols-outlined go')}</button><button class="plain" style="margin:22px 0" onclick="resetDemo()">Réinitialiser les données de démonstration</button>`}
function saveProfile(e){e.preventDefault();const f=new FormData(e.target);Object.assign(state.profile,{name:String(f.get('name')).trim(),city:String(f.get('city')).trim(),drive:f.get('drive'),capacity:Number(f.get('capacity')),fee:f.get('fee')});persist();notify('Préférences enregistrées.');go('home')}
function network(){return `${backHeader('Mon profil')}<h1 class="page-title">Compagnons<br>de route.</h1><p class="sub">Des rencontres réelles, pas des invitations à collectionner.</p><div class="section"><h2>Mes compagnons</h2><span class="pill">1er cercle</span></div>${state.friends.map((n,idx)=>`<div class="member"><span class="avatar">${escapeHtml(n[0])}</span><div><b>${escapeHtml(n)}</b><small>Covoiturage partagé</small></div><button class="smallbtn" onclick="removeFriend(${idx})">Masquer</button></div>`).join('')}<div class="section"><h2>Leurs compagnons</h2><span class="pill">2e cercle</span></div>${state.intro.map(n=>`<div class="member"><span class="avatar">${escapeHtml(n[0])}</span><div><b>${escapeHtml(n.split(' via ')[0])}</b><small>Via ${escapeHtml(n.split(' via ')[1])}</small></div><span class="right">${i('person_add')}</span></div>`).join('')}<div class="notice">Vous restez visible uniquement selon vos préférences. Une connexion peut être masquée à tout moment.</div>`}
function removeFriend(idx){state.friends.splice(idx,1);persist();notify('Relation masquée dans la démonstration.');render()}
function matches(){return `${backHeader('Calendrier')}<h1 class="page-title">Prochains matchs.</h1><p class="sub">Choisissez la rencontre pour organiser le covoiturage.</p>${[['28 novembre · 16 h 35','La Rochelle · Perpignan'],['19/20 décembre','La Rochelle · Castres'],['2/3 janvier','La Rochelle · Pau']].map(([d,n])=>`<button class="simple-card" onclick="notify('Cette démonstration est configurée sur le match du 28 novembre.')"><span class="leading">${i('calendar_month')}</span><span class="ct"><b>${n}</b><small>${d}</small></span>${i('chevron_right')}</button>`).join('')}`}
function resetDemo(){if(confirm('Réinitialiser le prototype ?')){state=structuredClone(seed);persist();filterTown=state.profile.city;notify('Données réinitialisées.');go('home')}}
function render(){navRender();const pages={home,discover,offer,create,crews,crew,messages,profile,network,matches};root.innerHTML=(pages[view]||home)();if(view==='discover'){const e=document.getElementById('city');e.addEventListener('input',()=>{filterTown=e.value;document.getElementById('results').innerHTML=offerResults()})}}
render();
</script></body></html>
